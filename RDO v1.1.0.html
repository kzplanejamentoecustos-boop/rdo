        await car.fim(false, 'Base não importada');
        toast.erro('Base não importada', resultado.erros.join(' '));
        return;

      base = resultado.base;
      nomeArquivo = arquivo.name;

  function exigirBase() {
    if (base) return true;

  const NOMES_PERFIL = { administrador: 'Administrador', controlador: 'Controlador', apontamento: 'Apontamento', visualizador: 'Visualizador' };
  function entrar(perfil, usuario = null) {
    exigirAceitePrivacidade(() => entrarAceito(perfil, usuario));
  }
  function entrarAceito(perfil, usuario = null) {
    if (!elemento.isConnected) return;   // ja entrou (toque duplo): nao monta o aplicativo de novo

    // o aplicativo recebe uma COPIA: o que for editado e nao salvo nao altera a base carregada aqui
    const copia = JSON.parse(JSON.stringify(base));

    const ident = (base && base.identidade) || {};
    mostrarBoasVindas({
      nome: usuario ? usuario.nome : '',
      perfil: NOMES_PERFIL[perfil] || perfil,
      visualizador: perfil === 'visualizador',
      aplicativo: ident.titulo || titulo,
      local: ident.subtitulo || subtitulo,
      logo: logoDaEntrada(),
    });
  }

  /* ---- Visualizador ---- */
  function entrarVisualizador() {
    if (exigirBase()) entrar('visualizador', acessoPortal ? usuarioPortal() : null);
  }

  /* ---- Controlador ---- */
  /*
   * v6.9: dois perfis que registram. Apontamento (Portal: Editor) registra tudo, mas nao desfaz nem altera datas
   * ja salvas; Controlador (Portal: Admin) pode tudo. Sem o Portal, valem os controladores da base.
   */
  const entrarControlador = () => entrarQueRegistra('controlador');
  const entrarApontamento = () => entrarQueRegistra('apontamento');
  async function entrarQueRegistra(perfilAlvo) {
    if (!exigirBase()) return;
    const nomeAlvo = NOMES_PERFIL[perfilAlvo];
    if (acessoPortal) {
      const minimo = perfilAlvo === 'controlador' ? 'admin' : 'editor';
      if (portalPermite(minimo)) { entrar(perfilAlvo, usuarioPortal()); return; }
      const papel = NOME_PAPEL_PORTAL[acessoPortal.papel] || 'Leitor';
      if (perfilAlvo === 'controlador' && portalPermite('editor')) {
        toast.aviso('Entre como Apontamento', `Seu acesso ao ${nomeControle} nesta obra é ${papel}: você registra pelo Apontamento. Só o Controlador (Admin no Portal) desfaz e corrige datas.`);
        return;
      }
      toast.aviso('Acesso somente para consulta', `Seu acesso ao ${nomeControle} nesta obra é ${papel}. Entre como Visualizador ou peça ao gestor da obra para liberar a edição.`);
      return;
    }
    if (!base.controladores.length) {
      // sem controladores na base: o acesso vem do login do Portal KZ
      if (onLoginPortal) {
        if (await loginPortal()) entrarQueRegistra(perfilAlvo);
        return;
      }
      criarModal({
        titulo: 'Nenhum controlador cadastrado',
        tamanho: 'sm',
        destruirAoFechar: true,
        conteudo: h('p', {}, 'Esta base ainda não tem controladores. O administrador precisa cadastrá-los e exportar a base.'),
        acoes: [{ texto: 'Entendi', variante: 'primary' }],
      }).abrir();
      return;
    }
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [
        campoLoginControlador(base.controladores),
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true },
      ],
      onEnviar: async ({ login, senha }) => {
        const registro = base.controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        modal.fechar();
        entrar(perfilAlvo, { login: registro.login, nome: registro.nome || registro.login });
      },
    });
    const focarSenha = ligarLoginASenha(formulario);
    const modal = criarModal({
      titulo: `Entrar como ${nomeAlvo}`,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: formulario.elemento,
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: 'Entrar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    modal.abrir();
    focarSenha();
  }

  /* ---- Administrador ---- */
  function abrirAdministracao(senhaMestra) {
    if (!base) base = criarBaseVazia(formato);
    let tabela = null;

    const atualizarTabela = () => tabela.definirDados(base.controladores);
    tabela = criarTabela({
      compacta: true,
      altura: 'auto',
      dados: base.controladores,
      vazio: { titulo: 'Nenhum controlador cadastrado', mensagem: 'Use o formulário abaixo para adicionar.' },
      colunas: [
        { campo: 'login', titulo: 'Login' },
        { campo: 'nome', titulo: 'Nome' },
        {
          campo: 'senha', titulo: 'Senha', ordenavel: false,
          render: (_, linha) => {
            const oculto = '••••••••';
            const botao = criarBotao({ texto: oculto, icone: 'olho', variante: 'ghost', tamanho: 'sm', titulo: 'Mostrar senha' });
            const texto = botao.querySelector('span');
            let visivel = false;
            botao.addEventListener('click', async () => {
              if (visivel) {
                texto.textContent = oculto;
                visivel = false;
                botao.title = 'Mostrar senha';
                return;
              }
              if (!linha.senhaCifrada || !criptografiaDisponivel()) {
                toast.aviso('Senha não disponível', 'Este controlador foi cadastrado antes desta versão. Remova-o e cadastre de novo para poder visualizar a senha.');
                return;
              }
              try {
                texto.textContent = await comCarregamento(botao, () => decifrarTexto(linha.senhaCifrada, senhaMestra, linha.sal));
                visivel = true;
                botao.title = 'Ocultar senha';
              } catch (erro) {
                toast.erro('Não foi possível mostrar a senha', 'A base pode ter sido alterada fora do aplicativo.');
              }
            });
            return botao;
          },
        },
        { campo: 'criadoEm', titulo: 'Cadastrado em', formatar: (v) => formatarData(v, 'data-hora') },
        {
          campo: 'acoes', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
          render: (_, linha) => criarBotao({
            icone: 'lixeira', variante: 'ghost', tamanho: 'sm', titulo: `Remover ${linha.login}`,
            onClick: async () => {
              const ok = await confirmar({ titulo: `Remover ${linha.login}?`, mensagem: 'Este controlador não conseguirá mais entrar com a base exportada a partir de agora.', textoConfirmar: 'Remover', perigo: true });
              if (!ok) return;
              base.controladores = base.controladores.filter((c) => c !== linha);
              pendenteExportar = true;
              atualizarTabela();
              atualizarStatus();
              toast.aviso('Controlador removido', 'Exporte a base para gravar a alteração.');
            },
          }),
        },
      ],
    });

    const formulario = criarFormulario({
      colunas: 2,
      textoEnviar: 'Adicionar controlador',
      campos: [
        { nome: 'nome', rotulo: 'Nome', obrigatorio: true },
        {
          nome: 'login', rotulo: 'Login', obrigatorio: true, dica: 'De 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.',
          regras: {
            validar: (v) => {
              if (!/^[a-zA-Z0-9._-]{3,30}$/.test(String(v).trim())) return 'Use de 3 a 30 letras, números, ponto, hífen ou sublinhado.';
              if (base.controladores.some((c) => c.login === normalizarLogin(v))) return 'Este login já está cadastrado.';
              return true;
            },
          },
        },
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true, regras: { minCaracteres: 6 }, atributos: { autocomplete: 'new-password' } },
        {
          nome: 'confirmacao', rotulo: 'Confirmar senha', tipo: 'senha', obrigatorio: true, atributos: { autocomplete: 'new-password' },
          regras: { validar: (v, valores) => v === valores.senha || 'As senhas não conferem.' },
        },
      ],
      onEnviar: async ({ nome, login, senha }) => {
        base.controladores.push(await criarCredencial({ login, nome, senha, senhaMestra }));
        pendenteExportar = true;
        formulario.elemento.reset();
        formulario.limparErros();
        atualizarTabela();
        atualizarStatus();
        toast.sucesso('Controlador adicionado', `${normalizarLogin(login)} — exporte a base para gravar.`);
      },
    });

    /* ---- Banco de dados na nuvem (Firebase) ---- */
    let modalAdmin = null;
    let painelNuvem = null;
    if (armazenamento && armazenamento.configurar) {
      const statusNuvem = h('div', {});
      const atualizarStatusNuvem = () => {
        const cfg = armazenamento.obterConfig();
        statusNuvem.replaceChildren(cfg
          ? criarAlerta({ tipo: 'success', titulo: `Conectado ao Firebase — projeto ${cfg.projectId}`, mensagem: 'Salvar na nuvem, Salvar na base existente e Abrir versão salva usam este banco.' })
          : criarAlerta({ tipo: 'info', titulo: 'Firebase não configurado', mensagem: 'Enquanto isso, as versões ficam guardadas somente neste navegador.' }));
      };
      const campoConfig = criarCampo({
        nome: 'firebaseConfig', rotulo: 'Configuração do Firebase (firebaseConfig)', tipo: 'textarea', larguraTotal: true,
        placeholder: 'Cole aqui o trecho do console do Firebase:\nconst firebaseConfig = {\n  apiKey: "...",\n  projectId: "...",\n  appId: "..."\n};',
        dica: 'Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration.',
      });
      const textoConfig = campoConfig.querySelector('textarea');
      const cfgAtual = armazenamento.obterConfig();
      if (cfgAtual) textoConfig.value = `const firebaseConfig = ${JSON.stringify(cfgAtual, null, 2)};`;

      const botaoConectar = criarBotao({
        texto: 'Salvar e conectar', icone: 'upload', variante: 'primary',
        onClick: async () => {
          const leitura = interpretarConfigFirebase(textoConfig.value);
          if (!leitura.valido) { toast.erro('Configuração incompleta', leitura.erros.join(' ')); return; }
          try {
            const { versoes } = await comCarregamento(botaoConectar, () => armazenamento.configurar(leitura.config));
            base.nuvem = { ...(base.nuvem || {}), firebase: leitura.config };
            atualizarStatusNuvem();
            atualizarStatus();
            toast.sucesso('Firebase conectado', `Projeto ${leitura.config.projectId} — ${versoes.length} versão(ões) encontrada(s).`);
            // ja traz as versoes da nuvem para escolher qual abrir
            if (versoes.length) { modalAdmin.fechar(); abrirVersaoSalva(); }
          } catch (erro) {
            toast.erro('Não foi possível conectar', erro.message);
          }
        },
      });
      const botaoRemoverNuvem = criarBotao({
        texto: 'Remover configuração', icone: 'lixeira', variante: 'ghost',
        onClick: async () => {
          const ok = await confirmar({ titulo: 'Remover a configuração do Firebase?', mensagem: 'Os dados na nuvem não são apagados; este navegador apenas deixa de usá-los.', textoConfirmar: 'Remover', perigo: true });
          if (!ok) return;
          armazenamento.removerConfig();
          if (base.nuvem) delete base.nuvem.firebase;
          textoConfig.value = '';
          atualizarStatusNuvem();
          toast.info('Configuração removida', 'As versões voltam a ser guardadas neste navegador.');
        },
      });
      atualizarStatusNuvem();
      painelNuvem = criarPainel({
        titulo: 'Banco de dados na nuvem (Firebase)', icone: 'configuracao',
        conteudo: h('div', { class: 'ctc-stack' },
          statusNuvem,
          campoConfig,
          h('div', { class: 'ctc-cluster' }, botaoConectar, botaoRemoverNuvem),
          criarAlerta({
            tipo: 'warning',
            titulo: 'Regras de acesso do Firestore',
            mensagem: 'Este modelo não usa login do Firebase. As regras do banco precisam permitir leitura e escrita, e qualquer pessoa com esta configuração consegue acessar os dados. Use apenas para dados internos e revise as regras no console.',
          })),
      }).elemento;
    }

    modalAdmin = criarModal({
      titulo: 'Administração de controladores',
      tamanho: 'lg',
      destruirAoFechar: true,
      conteudo: [
        criarAlerta({
          tipo: 'info',
          titulo: 'Os controladores ficam gravados dentro do arquivo JSON',
          mensagem: 'Depois de adicionar ou remover, clique em "Exportar base (JSON)" e passe a usar o novo arquivo.',
        }),
        criarPainel({ titulo: 'Controladores cadastrados', icone: 'usuario', semEspaco: true, conteudo: tabela.elemento }).elemento,
        criarPainel({ titulo: 'Novo controlador', icone: 'mais', conteudo: formulario.elemento }).elemento,
        painelNuvem,
      ],
      acoes: [
        { texto: 'Fechar', variante: 'outline' },
        {
          texto: 'Exportar base (JSON)', icone: 'download', variante: 'primary', fechar: false,
          onClick: () => {
            const nome = nomeArquivoBase(prefixoArquivo || formato || 'base');
            base = prepararBaseParaSalvar(base);
            baixarJSON(base, nome);
            pendenteExportar = false;
            atualizarStatus();
            toast.sucesso('Base exportada', `${nome} — use este arquivo na próxima abertura.`);
          },
        },
      ],
    });
    modalAdmin.abrir();
  }

  async function entrarAdministrador() {
    if (acessoPortal) {
      criarModal({
        titulo: 'Acessos da equipe',
        tamanho: 'sm',
        destruirAoFechar: true,
        conteudo: h('p', {}, 'Com o login KZ não há controladores nem senhas nesta base: o acesso de cada pessoa (Leitor, Editor ou Administrador) é liberado pelo gestor da obra no Portal KZ.'),
        acoes: portalPermite('editor')
          ? [{ texto: 'Fechar', variante: 'outline' }, { texto: 'Entrar como Controlador', variante: 'primary', onClick: () => entrar('controlador', usuarioPortal()) }]
          : [{ texto: 'Entendi', variante: 'primary' }],
      }).abrir();
      return;
    }
    const senha = await solicitarSenhaAdministrador({ administrador, titulo: 'Acesso do Administrador', textoConfirmar: 'Entrar' });
    if (senha) abrirAdministracao(senha);
  }

  /* ---- Iniciar controle: base em branco, liberada pela senha do administrador ---- */
  async function iniciarControle() {
    if (importada || pendenteExportar) {
      const ok = await confirmar({
        titulo: 'Iniciar um controle em branco?',
        mensagem: 'A base carregada sai da tela inicial (o arquivo ou a versão na nuvem não são alterados). Os dados novos só ficam gravados quando você salvar.',
        textoConfirmar: 'Iniciar em branco',
      });
      if (!ok) return;
    }
    if (acessoPortal && !portalPermite('admin')) {
      toast.aviso('Sem permissão', 'Criar um projeto novo é só para o Controlador (Admin no Portal KZ).');
      return;
    }
    if (!acessoPortal) {
      const senha = await solicitarSenhaAdministrador({
        administrador,
        titulo: 'Iniciar controle',
        mensagem: 'Informe a senha do administrador para criar uma base em branco.',
        textoConfirmar: 'Criar base em branco',
      });
      if (!senha) return;
    }
    const nova = typeof criarBaseNova === 'function' ? criarBaseNova() : criarBaseVazia(formato);
    base = validarBase({ ...nova, formato }, { formato }).base;
    nomeArquivo = 'Novo controle (ainda não salvo)';
    importada = true;
    pendenteExportar = false;
    atualizarStatus();
    toast.sucesso('Base em branco criada', 'Comece a atualizar e salve em Controlador > Ferramentas.');
    if (acessoPortal) entrar('controlador', usuarioPortal());
    else entrar('administrador', { login: 'administrador', nome: 'Administrador' });
  }

  /* ---- Layout no modelo do Controle de Custos (Rev80): Importar em menu, Projeto novo e perfis em cartoes ---- */
  // SVGs fixos deste arquivo (sem dados do usuario)
  const SVG_LD = {

    escudo: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>',
  };
  const icoLd = (classe, svg, estilo) => { const s = h('span', { class: classe, style: estilo || '' }); s.innerHTML = svg; return s; };
  const cartaoLd = ({ svg, fundo, cor, titulo: t, sub, onClick, dica }) => h('button', { type: 'button', class: 'ctc-ld-opc', title: dica || t, onClick },
    icoLd('ctc-ld-opc__ico', svg, `background:${fundo};color:${cor}`), h('b', {}, t), h('span', {}, sub));

  const opcoesImportar = h('div', { class: 'ctc-ld-opcoes', hidden: true },
    armazenamento ? cartaoLd({ svg: SVG_LD.nuvem, fundo: '#e0f2fe', cor: '#0369a1', titulo: 'Versão na nuvem', sub: 'Abrir uma versão salva', onClick: abrirVersaoSalva }) : null,
    cartaoLd({ svg: SVG_LD.json, fundo: '#fef3c7', cor: '#b45309', titulo: 'Arquivo JSON', sub: 'Abrir um arquivo do computador', onClick: () => entrada.click() }));
  const setaImportar = h('span', { class: 'ctc-ld-imp__seta', 'aria-hidden': 'true' }, '▾');
  const botaoImportar = h('button', {
    type: 'button', class: 'ctc-ld-imp', title: 'Importar os dados da obra', 'aria-expanded': 'false',
    onClick: () => {
      const abrir = opcoesImportar.hidden;
      opcoesImportar.hidden = !abrir;
      botaoImportar.classList.toggle('is-open', abrir);
      botaoImportar.setAttribute('aria-expanded', String(abrir));
    },
  },
  icoLd('ctc-ld-imp__ico', SVG_LD.importar),
  h('span', { class: 'ctc-ld-imp__txt' }, h('b', {}, 'Importar'), h('span', {}, armazenamento ? 'Versão na nuvem ou arquivo JSON' : 'Arquivo JSON')),
  setaImportar);

  const botaoProjetoNovo = h('button', { type: 'button', class: 'ctc-ld-imp ctc-ld-novo', title: 'Iniciar um controle em branco (pede a senha do administrador)', onClick: iniciarControle },
    icoLd('ctc-ld-imp__ico', SVG_LD.novo),
    h('span', { class: 'ctc-ld-imp__txt' }, h('b', {}, 'Projeto novo'), h('span', {}, 'Controle em branco')),
    h('span', { class: 'ctc-ld-imp__seta', 'aria-hidden': 'true' }, '➜'));

  const elPortal = h('div', { class: 'ctc-entrada__portal', hidden: !onLoginPortal });
  function atualizarPortal() {
    if (acessoPortal) {
      elPortal.hidden = false;
      elPortal.classList.add('is-conectado');
      elPortal.replaceChildren(h('span', {}, '✅ Conectado: ', h('b', {}, acessoPortal.nome),
        ` · ${NOME_PAPEL_PORTAL[acessoPortal.papel] || acessoPortal.papel} · obra ${acessoPortal.sigla}`));
    } else {
      elPortal.hidden = !onLoginPortal;
      elPortal.classList.remove('is-conectado');
      elPortal.replaceChildren(h('span', {}, '🔑 Tem login do Portal KZ? Entre com ele e use a senha do painel.'),
        h('button', { type: 'button', class: 'ctc-entrada__portal-btn', onClick: () => loginPortal() }, 'Entrar com o painel'));
    }
    const sub = botaoProjetoNovo.querySelector('.ctc-ld-imp__txt span');
    if (sub) sub.textContent = acessoPortal ? 'Controle em branco' : 'Controle em branco (senha do administrador)';
  }

  elLogoEntrada.className = 'ctc-landing__logo ctc-entrada__logo';
  elTituloEntrada.className = 'ctc-entrada__titulo';

  const elemento = h('div', { class: 'ctc-landing' },
    h('div', { class: 'ctc-landing__card ctc-entrada' },
      elLogoEntrada,
      elTituloEntrada,
      h('p', { class: 'ctc-entrada__sub' }, subtitulo),
      elPortal,
      h('div', { class: 'ctc-entrada__bloco' },
        h('span', { class: 'ctc-entrada__rotulo' }, '1. Importar dados da obra'),
        botaoImportar,
        opcoesImportar,
        status,
        linkRemover,
        entrada),
      botaoProjetoNovo,
      h('div', { class: 'ctc-entrada__bloco' },
        h('span', { class: 'ctc-entrada__rotulo' }, '2. Como você vai acessar?'),
        h('div', { class: 'ctc-ld-acessos' },
          cartaoLd({ svg: SVG_LD.olho, fundo: '#f1f5f9', cor: '#334155', titulo: 'Visualizador', sub: 'Consulta', dica: 'Somente leitura', onClick: entrarVisualizador }),
          cartaoLd({ svg: SVG_LD.capacete, fundo: '#fef3c7', cor: '#b45309', titulo: 'Apontamento', sub: 'Registra em campo', dica: 'Registra as etapas; não desfaz nem altera datas já salvas', onClick: entrarApontamento }),
          cartaoLd({ svg: SVG_LD.lapis, fundo: '#dbeafe', cor: '#1e3a8a', titulo: 'Controlador', sub: 'Pode tudo', dica: 'Registra, desfaz e corrige datas', onClick: entrarControlador }))),
      h('div', { class: 'ctc-entrada__links' },
        h('button', { type: 'button', onClick: () => abrirPrivacidade({ aba: 0 }) }, 'Privacidade'), ' · ',
        h('button', { type: 'button', onClick: () => abrirPrivacidade({ aba: 1 }) }, 'Termos de Uso')),
      rodape ? h('div', { class: 'ctc-entrada__rodape' }, rodape) : null));
  atualizarPortal();

  atualizarStatus();

  return {
    elemento,
    mostrar: (alvo = document.body) => { atualizarStatus(); alvo.append(elemento); },
    remover: () => elemento.remove(),
    obterBase: () => base,
    /** Login do Portal KZ detectado: perfis sem senha conforme o papel na obra. */
    definirAcessoPortal: (acesso) => {
      acessoPortal = acesso || null;
      atualizarPortal();
      atualizarStatus();
    },
    /** Atualiza a base mantida na tela (ex.: a versao que acabou de ser salva no aplicativo). */
    definirBase: (novaBase, novoNome = nomeArquivo) => {
      const resultado = validarBase(JSON.parse(JSON.stringify(novaBase)), { formato });
      if (!resultado.valida) return false;
      base = resultado.base;
      nomeArquivo = novoNome;
      importada = Boolean(novoNome);
      atualizarStatus();
      return true;
    },
  };
}

/**
 * Botao do canto superior direito que mostra o perfil e o numero de alteracoes nao salvas.
 * criarBotaoSessao({ sessao, texto: 'Controlador', onClick })
 */
function criarBotaoSessao({ sessao, texto = 'Controlador', onClick } = {}) {
  const botao = criarBotao({ texto, icone: 'usuario', variante: 'outline', contador: 0, onClick });
  const contador = botao.querySelector('.ctc-btn__count');
  const atualizar = ({ alteracoes }) => {
    contador.textContent = String(alteracoes);
    contador.classList.toggle('ctc-hidden', !alteracoes);
    botao.title = alteracoes ? `${alteracoes} alteração(ões) não salva(s)` : texto;
  };
  atualizar(sessao.obter());
  sessao.assinar(atualizar);
  return botao;
}

/**
 * Pede a senha do administrador. Retorna Promise<senha | null> (null = cancelado).
 *   const senha = await solicitarSenhaAdministrador({ administrador: { sal, hash } })
 */
function solicitarSenhaAdministrador({
  administrador = {}, titulo = 'Senha do administrador', mensagem, textoConfirmar = 'Confirmar',
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [{ nome: 'senha', rotulo: 'Senha do administrador', tipo: 'senha', obrigatorio: true }],
      onEnviar: async ({ senha }) => {

          formulario.definirErro('senha', 'Senha incorreta.');
          return;
        }
        resposta = senha;
        modal.fechar();
      },
    });

      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [mensagem ? h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem) : null, formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });

  });
}

/**
 * Pede login e senha de um controlador novamente (confirmacao antes de acoes sensiveis).
 * Retorna Promise<{ login, nome } | null> (null = cancelado).
 *   const quem = await solicitarCredenciais({ controladores: base.controladores, titulo: 'Confirme seu acesso', loginPadrao })
 * O controlador e escolhido numa lista; loginPadrao ja deixa um selecionado.
 */
function solicitarCredenciais({
  controladores = [], titulo = 'Confirme seu acesso', mensagem = 'Informe novamente seu login e senha de controlador.',
  textoConfirmar = 'Confirmar', loginPadrao,
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [
        campoLoginControlador(controladores, loginPadrao),
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true },
      ],
      onEnviar: async ({ login, senha }) => {
        const registro = controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        resposta = { login: registro.login, nome: registro.nome || registro.login };
        modal.fechar();
      },
    });
    const modal = criarModal({
      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem), formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    const focarSenha = ligarLoginASenha(formulario);
    modal.abrir();
    focarSenha();
  });
}

 */
async function abrirListaVersoes({
  armazenamento, titulo = 'Versões salvas', textoAcao = 'Abrir', varianteAcao = 'primary', onEscolher,
} = {}) {
  let versoes;
  try {
    versoes = await armazenamento.listar();

    toast.erro('Não foi possível listar as versões', erro.message);

    dados: versoes,

    altura: 'auto',
    ordenacao: { campo: 'salvoEm', direcao: 'desc' },

/**

/**
 * Abre o painel do controlador.
 *   abrirPainelControlador({
 *     sessao, titulo: 'Controlador', prefixoArquivo,
 *     obterBaseParaSalvar: () => base,   // o aplicativo monta a base atual (dados + controladores)
 *     armazenamento,                     // provedor de versoes: habilita "Salvar na nuvem" e "Salvar na base existente"
 *     administrador: { sal, hash },      // confirma os salvamentos de quem entrou como administrador
 *     onEditarCabecalho: () => {},       // habilita o bloco "Cabecalho e logo"
 *     onSair: () => { ... },             // trocar perfil / voltar a tela de entrada
 *     abasExtras: [{ id, texto, conteudo }],
 *   })
 * Os dois salvamentos em versao pedem login e senha de novo antes de abrir.
 */
function abrirPainelControlador({
  sessao, titulo = 'Controlador', prefixoArquivo = 'base', obterBaseParaSalvar, armazenamento, administrador,
  onEditarCabecalho, onSair, abasExtras = [], confirmacao,
} = {}) {
  let modal = null;
  let abas = null;
  const atualizarAba = () => { if (modal && modal.estaAberto()) abas.ativar('ferramentas'); };
  /* a configuracao da nuvem viaja junto com a base salva */
  const baseAtual = () => {
    const base = obterBaseParaSalvar();
    const configNuvem = armazenamento && armazenamento.obterConfig ? armazenamento.obterConfig() : null;
    return configNuvem ? { ...base, nuvem: { ...(base.nuvem || {}), firebase: configNuvem } } : base;
  };
  const logoDaBase = () => ((obterBaseParaSalvar() || {}).identidade || {}).logo;

  async function confirmarAcesso(acao) {
    // v6.9.4: com o login do Portal KZ (Firebase), quem esta logado ja e a confirmacao (igual ao Faturamento Direto)
    if (typeof confirmacao === 'function') return confirmacao(acao);
    // quem entrou por "Iniciar controle" (perfil administrador) confirma com a senha do administrador
    if (sessao.obter().perfil === 'administrador') {
      const senha = await solicitarSenhaAdministrador({
        administrador, titulo: 'Confirme seu acesso', mensagem: `Para ${acao}, informe novamente a senha do administrador.`,
      });
      return senha ? { login: 'administrador', nome: 'Administrador' } : null;
    }
    return solicitarCredenciais({
      controladores: obterBaseParaSalvar().controladores || [],
      titulo: 'Confirme seu acesso',
      mensagem: `Para ${acao}, confirme o controlador e informe a senha novamente.`,
      loginPadrao: sessao.obter().usuario ? sessao.obter().usuario.login : undefined,
    });
  }

  async function salvarNaNuvem() {
    const quem = await confirmarAcesso('salvar na nuvem');
    if (!quem) return;
    const nome = await solicitarValor({
      titulo: 'Salvar na nuvem',
      rotulo: 'Nome do salvamento',
      obrigatorio: true,
      regras: { minCaracteres: 3, maxCaracteres: 80 },
      valor: `${prefixoArquivo} ${formatarData(new Date(), 'data-hora')}`,
      textoConfirmar: 'Salvar',
    });
    if (nome == null) return;
    const car = mostrarCarregamento('salvar', nome, { logo: logoDaBase() });
    try {
      const versao = await armazenamento.salvar({ nome, base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
      await car.fim(true);
      sessao.limparAlteracoes(`Nuvem: ${versao.nome}`);
      toast.sucesso('Salvo na nuvem', `${versao.nome} — por ${quem.nome}`);
      atualizarAba();
    } catch (erro) {
      await car.fim(false, 'Não foi possível salvar');
      toast.erro('Falha ao salvar', erro.message);
    }
  }

  async function salvarNaBaseExistente() {
    const quem = await confirmarAcesso('substituir um salvamento existente');
    if (!quem) return;
    await abrirListaVersoes({
      armazenamento,
      titulo: 'Salvar na base existente',
      textoAcao: 'Substituir',
      varianteAcao: 'warning',
      onEscolher: async (versao) => {
        const ok = await confirmar({
          titulo: `Substituir "${versao.nome}"?`,
          mensagem: `O conteúdo salvo em ${formatarData(versao.salvoEm, 'data-hora')} será trocado pelos dados atuais.`,
          textoConfirmar: 'Substituir',
          perigo: true,
        });
        if (!ok) return false;
        const car = mostrarCarregamento('salvar', versao.nome, { logo: logoDaBase() });
        try {
          const nova = await armazenamento.substituir(versao.id, { base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
          await car.fim(true);
          sessao.limparAlteracoes(`Nuvem: ${nova.nome}`);
          toast.sucesso('Base substituída', `${nova.nome} — por ${quem.nome}`);
          atualizarAba();
          return true;
        } catch (erro) {
          await car.fim(false, 'Não foi possível salvar');
          toast.erro('Falha ao substituir', erro.message);
          return false;
        }
      },
    });
  }

  function exportarArquivo() {
    const nome = nomeArquivoBase(prefixoArquivo);
    baixarJSON(prepararBaseParaSalvar(baseAtual()), nome);
    sessao.limparAlteracoes(nome);
    toast.sucesso('Arquivo exportado', nome);
    atualizarAba();
  }

  function ferramentas() {
    const estado = sessao.obter();
    const blocos = [];
    if (sessao.podeEditar()) {
      if (estado.alteracoes) {
        blocos.push(criarAlerta({ tipo: 'warning', titulo: 'Alterações não salvas', mensagem: `Há ${estado.alteracoes} alteração(ões) feitas nesta sessão que ainda não foram gravadas.` }));
      }
      blocos.push(criarPainel({
        titulo: 'Salvar', icone: 'salvar',
        conteudo: h('div', { class: 'ctc-stack' },
          armazenamento ? h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Salvar na nuvem', icone: 'upload', variante: 'primary', onClick: salvarNaNuvem }),
            criarBotao({ texto: 'Salvar na base existente', icone: 'salvar', variante: 'secondary', onClick: salvarNaBaseExistente })) : null,
          armazenamento && armazenamento.descricao
            ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Local de armazenamento: ${armazenamento.descricao}. Os dois salvamentos pedem login e senha novamente.`)
            : null,
          h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Exportar arquivo JSON', icone: 'download', variante: 'outline', tamanho: 'sm', onClick: exportarArquivo }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'Cópia em arquivo, para guardar ou enviar.'))),
      }).elemento);
      if (typeof onEditarCabecalho === 'function') {
        blocos.push(criarPainel({
          titulo: 'Cabeçalho e logo', icone: 'editar',
          conteudo: h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Editar cabeçalho e logo', icone: 'editar', variante: 'outline', onClick: onEditarCabecalho }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'A alteração é gravada na base no próximo salvamento.')),
        }).elemento);
      }
    } else {
      blocos.push(criarAlerta({ tipo: 'info', titulo: 'Modo visualizador', mensagem: 'Salvamento e edição do cabeçalho estão disponíveis somente para controladores.' }));
    }
    return h('div', { class: 'ctc-stack' }, blocos);
  }

  function painelSaida() {
    return criarPainel({
      titulo: 'Sessão de uso', icone: 'sair',
      conteudo: h('div', { class: 'ctc-stack' },
        h('p', { class: 'ctc-text-sm ctc-text-muted' }, 'Volta à tela inicial para trocar de perfil ou abrir outra base.'),
        criarBotao({
          texto: 'Trocar perfil / Sair', icone: 'sair', variante: 'outline',
          onClick: async () => {
            const pendentes = sessao.obter().alteracoes;
            if (pendentes && sessao.podeEditar()) {
              const ok = await confirmar({ titulo: 'Sair sem salvar?', mensagem: `As ${pendentes} alteração(ões) não salvas serão perdidas.`, textoConfirmar: 'Sair sem salvar', perigo: true });
              if (!ok) return;
            }
            modal.fechar();
            if (typeof onSair === 'function') onSair();
          },
        })),
    }).elemento;
  }

  function infoSessao() {
    const e = sessao.obter();
    const linhas = [
      { item: 'Perfil', valor: ROTULO_PERFIL[e.perfil] || '—' },
      { item: 'Usuário', valor: e.usuario ? `${e.usuario.nome} (${e.usuario.login})` : '—' },
      { item: 'Base em uso', valor: e.nomeArquivo || 'Base de demonstração (não importada)' },
      { item: 'Último salvamento', valor: e.ultimoSalvamento ? formatarData(e.ultimoSalvamento, 'data-hora') : '—' },
      { item: 'Alterações não salvas', valor: String(e.alteracoes) },
    ];
    const tabela = criarTabela({
      compacta: true, altura: 'auto', cabecalhoClaro: true, dados: linhas,
      colunas: [{ campo: 'item', titulo: 'Item', ordenavel: false }, { campo: 'valor', titulo: 'Valor', ordenavel: false }],
    }).elemento;
    return h('div', { class: 'ctc-stack' }, tabela, painelSaida());
  }

  abas = criarAbas({
    abas: [
      { id: 'ferramentas', texto: 'Ferramentas', conteudo: ferramentas },
      { id: 'sessao', texto: 'Sessão', conteudo: infoSessao },
      ...abasExtras,
    ],
  });

  modal = criarModal({ titulo, tamanho: 'lg', destruirAoFechar: true, conteudo: abas.elemento });
  modal.abrir();
  return modal;
}

/* ===== compartilhado/acesso-kz.js (KZ App Standard v1.7) ===== */
const KZ = (() => {
/* =============================================================================
   KZ App Standard — compartilhado/acesso-kz.js
   Versao: 1.7.0  (modulo novo da v1.7: login real no Firebase)

   Substitui, nos aplicativos KZ, a senha mestre e os perfis gravados no JSON
   por LOGIN DO FIREBASE (e-mail e senha) e PERMISSOES POR OBRA E CONTROLE,
   garantidas pelas regras do Firestore (ver firestore.rules do Portal KZ).

   Estrutura no Firestore:
     gestores_gerais/{uid}                         gestores gerais (console)
     usuarios/{uid}          { nome, email }       criado pela propria pessoa
     usuarios_email/{email}  { uid, nome }         busca por e-mail
     obras/{obra}            { nome, sigla, situacao, controles: { id: { nome, url, basico } } }
     obras/{obra}/membros/{uid}  { uid, nome, email, gestor, papeis: { '*'|controle: 'leitor'|'editor'|'admin' } }
     obras/{obra}/{controle}/... dados de cada controle

   ESTRUTURA
   01. Firebase (carregado sob demanda do gstatic)
   02. Login, conta e senha
   03. Perfil do usuario: gestor geral, obras e papeis
   04. Gestao: obras, membros e usuarios
   05. Telas: login, aguardando liberacao, painel da sessao
   ========================================================================== */



/* =============================================================================
   01. FIREBASE
   ========================================================================== */

let pronto = null;

/**
 * Inicia o Firebase (app padrao: o login fica compartilhado entre todos os
 * aplicativos KZ abertos no mesmo endereco). Retorna { auth, db, fa, fs }.
 */
function iniciarFirebase(config) {
  if (!pronto) {
    pronto = (async () => {
      const endereco = `https://www.gstatic.com/firebasejs/${VERSAO_SDK_FIREBASE}`;
      const [moduloApp, fa, fs] = await Promise.all([
        import(`${endereco}/firebase-app.js`),
        import(`${endereco}/firebase-auth.js`),
        import(`${endereco}/firebase-firestore.js`),
      ]);
      const app = moduloApp.getApps().length ? moduloApp.getApp() : moduloApp.initializeApp(config);
      return { auth: fa.getAuth(app), db: fs.getFirestore(app), fa, fs };
    })().catch((erro) => { pronto = null; throw new Error(traduzirErroAcesso(erro)); });
  }
  return pronto;
}

async function sdk() {
  if (!pronto) throw new Error('Firebase não iniciado: chame iniciarFirebase(config) antes.');
  return pronto;
}

/** Mensagens em portugues para os erros do Firebase. */
function traduzirErroAcesso(erro) {
  const codigo = (erro && (erro.code || erro.message)) || String(erro);
  const mapa = {
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'Senha atual incorreta.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-disabled': 'Usuário desativado. Fale com o gestor.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos ou redefina a senha.',
    'auth/network-request-failed': 'Sem conexão com a internet.',
    'auth/email-already-in-use': 'Já existe uma conta com este e-mail. Use "Entrar" ou "Esqueci a senha".',
    'auth/weak-password': 'Senha fraca: use pelo menos 8 caracteres.',
    'auth/admin-restricted-operation': 'O cadastro de novas contas está desativado. Peça ao gestor para criar o seu acesso.',
    'auth/operation-not-allowed': 'Login por e-mail e senha não está ativado no Firebase.',
    'auth/requires-recent-login': 'Por segurança, saia e entre de novo antes de trocar a senha.',
    'permission-denied': 'Você não tem permissão para esta ação.',
    unavailable: 'O Firebase não respondeu. Verifique a internet.',
  };
  if (mapa[codigo]) return mapa[codigo];
  if (/permission/i.test(codigo)) return mapa['permission-denied'];
  if (/importing|dynamically imported module|Failed to load module/i.test(codigo)) return 'Não foi possível carregar o Firebase. Verifique a internet ou se o acesso a gstatic.com está liberado.';
  return codigo;
}

async function executar(operacao) {
  try { return await operacao(await sdk()); }
  catch (erro) { throw new Error(traduzirErroAcesso(erro)); }
}

   ========================================================================== */

/** Chama onMudar(usuario | null) a cada entrada/saida. Ignora sessoes anonimas antigas. */
async function observarLogin(onMudar) {
  const { auth, fa } = await sdk();
  return fa.onAuthStateChanged(auth, (usuario) => {
    if (usuario && usuario.isAnonymous) { fa.signOut(auth); return; }
    onMudar(usuario || null);
  });
}

const entrar = (email, senha) => executar(({ auth, fa }) =>
  fa.signInWithEmailAndPassword(auth, String(email).trim(), senha));

const sair = () => executar(({ auth, fa }) => fa.signOut(auth));

/** Envia o e-mail de redefinicao. Nao revela se o e-mail existe. */
async function redefinirSenha(email) {
  try { await executar(({ auth, fa }) => fa.sendPasswordResetEmail(auth, String(email).trim())); }
  catch (erro) { if (/inválido|internet/i.test(erro.message)) throw erro; }
}

/** Cria a conta e o cadastro (usuarios + usuarios_email). A pessoa fica aguardando liberacao. */
function criarConta({ nome, email, senha }) {
  return executar(async ({ auth, db, fa, fs }) => {
    const cred = await fa.createUserWithEmailAndPassword(auth, String(email).trim(), senha);
    const u = cred.user;
    const nomeLimpo = String(nome).trim();
    await fa.updateProfile(u, { displayName: nomeLimpo });
    await fs.setDoc(fs.doc(db, 'usuarios', u.uid), { nome: nomeLimpo, email: u.email, criadoEm: new Date().toISOString() });
    await fs.setDoc(fs.doc(db, 'usuarios_email', u.email), { uid: u.uid, nome: nomeLimpo });
    return u;
  });
}

/** Troca a senha de quem esta logado (confirma a senha atual antes). */
function trocarSenha(senhaAtual, novaSenha) {
  return executar(async ({ auth, fa }) => {
    const u = auth.currentUser;
    await fa.reauthenticateWithCredential(u, fa.EmailAuthProvider.credential(u.email, senhaAtual));
    await fa.updatePassword(u, novaSenha);
  });
}


/** Altera o nome de quem esta logado (cadastro e perfil do Firebase). */
function alterarMeuNome(nome) {
  return executar(async ({ auth, db, fa, fs }) => {
    const u = auth.currentUser;
    const nomeLimpo = String(nome || '').trim();
    await fs.updateDoc(fs.doc(db, 'usuarios', u.uid), { nome: nomeLimpo });
    await fa.updateProfile(u, { displayName: nomeLimpo });
  });
}

const PAPEIS = { leitor: 'Leitor', editor: 'Editor', admin: 'Admin' };
const NIVEL = { '': 0, leitor: 1, editor: 2, admin: 3 };

/**
 * Papel efetivo de um membro em um controle ('' = sem acesso). Gestor = admin de tudo.
 * papeis[controle] = 'nenhum' bloqueia um controle mesmo quando '*' libera os demais.
 */
function papelNoControle(membro, controle) {
  if (!membro) return '';
  if (membro.gestor) return 'admin';
  const papeis = membro.papeis || {};
  const papel = papeis[controle] || papeis['*'] || '';
  return PAPEIS[papel] ? papel : '';
}
const podeEditarPapel = (papel) => NIVEL[papel] >= NIVEL.editor;

/**
 * Carrega quem e o usuario e o que ele acessa:
 * { uid, email, nome, gestorGeral, obras: [{ id, nome, sigla, situacao, controles, membro }] }
 * Para o gestor geral, todas as obras aparecem como gestor.
 */
function carregarPerfil(usuario) {
  return executar(async ({ db, fs }) => {
    const [gg, cadastro, obrasSnap] = await Promise.all([
      fs.getDoc(fs.doc(db, 'gestores_gerais', usuario.uid)),
      fs.getDoc(fs.doc(db, 'usuarios', usuario.uid)),
      fs.getDocs(fs.collection(db, 'obras')),
    ]);
    const gestorGeral = gg.exists();
    const obras = [];
    await Promise.all(obrasSnap.docs.map(async (d) => {
      let membro = null;
      if (gestorGeral) membro = { gestor: true, papeis: { '*': 'admin' } };
      else {
        const m = await fs.getDoc(fs.doc(db, 'obras', d.id, 'membros', usuario.uid));
        if (m.exists()) membro = m.data();
      }
      if (membro) obras.push({ id: d.id, ...d.data(), membro });
    }));
    obras.sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    return {
      uid: usuario.uid,
      email: usuario.email,
      nome: (cadastro.exists() && cadastro.data().nome) || usuario.displayName || usuario.email,
      temCadastro: cadastro.exists(),
      gestorGeral,
      obras,
    };
  });
}

/**
 * Obra dos aplicativos: vem do Portal (?obra=wsf3) ou da ultima obra escolhida no Portal.
 * Retorna '' quando o aplicativo foi aberto sem obra.
 */
function obraDaUrl() {
  let o = new URLSearchParams(window.location.search).get('obra');
  if (!o) { try { o = localStorage.getItem('kz-portal-obra'); } catch { o = null; } }
  return String(o || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
}

/**
 * Perfil de quem esta logado em um controle de uma obra.
 * Retorna { papel: ''|'leitor'|'editor'|'admin', obra: { id, nome, sigla, ... } | null, nome }.
 */
function papelNaObra(obra, controle) {
  return executar(async ({ auth, db, fs }) => {
    const u = auth.currentUser;
    const [gg, m, o, cadastro] = await Promise.all([
      fs.getDoc(fs.doc(db, 'gestores_gerais', u.uid)),
      fs.getDoc(fs.doc(db, 'obras', obra, 'membros', u.uid)),
      fs.getDoc(fs.doc(db, 'obras', obra)),
      fs.getDoc(fs.doc(db, 'usuarios', u.uid)),
    ]);
    const nome = (cadastro.exists() && cadastro.data().nome) || u.displayName || u.email;
    if (!o.exists()) return { papel: '', obra: null, nome };
    const papel = gg.exists() ? 'admin' : (m.exists() ? papelNoControle(m.data(), controle) : '');
    return { papel, obra: { id: obra, ...o.data() }, nome };
  });
}

/**
 * Versoes salvas de um controle DENTRO da obra, usando o login do Firebase.
 * Mesmos metodos e formato do armazenamento de versoes do padrao:
 *   obras/{obra}/{controle}/{id}            -> { nome, salvoEm, autor, tamanho }
 *   obras/{obra}/{controle}_conteudo/{id}   -> { conteudo: "<base JSON em texto>" }
 */
function criarArmazenamentoObra({ obra, controle, limite = 900000 }) {
  const colecao = ['obras', obra, controle];
  const colecaoConteudo = ['obras', obra, `${controle}_conteudo`];
  const serializar = (base) => {
    const conteudo = JSON.stringify(base);
    if (conteudo.length > limite) throw new Error(`A base tem ${Math.round(conteudo.length / 1024)} KB e passa do limite de cerca de 900 KB por salvamento. Reduza a logo ou fale com o suporte.`);
    return conteudo;
  };
  return {
    descricao: `Nuvem KZ — obra ${obra.toUpperCase()}`,
    usandoFirebase: () => true,
    obterConfig: () => null,
    configurar: async () => { throw new Error('A nuvem é configurada pelo gestor.'); },
    removerConfig: () => {},
    listar: () => executar(async ({ db, fs }) => {
      const r = await fs.getDocs(fs.query(fs.collection(db, ...colecao), fs.orderBy('salvoEm', 'desc')));
      return r.docs.map((d) => ({ id: d.id, ...d.data() }));
    }),
    salvar: ({ nome, base, autor }) => executar(async ({ db, fs }) => {
      const conteudo = serializar(base);
      const ref = fs.doc(fs.collection(db, ...colecao));
      const meta = { nome: String(nome).trim(), salvoEm: new Date().toISOString(), autor: autor || '', tamanho: conteudo.length };
      const lote = fs.writeBatch(db);
      lote.set(ref, meta);
      lote.set(fs.doc(db, ...colecaoConteudo, ref.id), { conteudo });
      await lote.commit();
      return { id: ref.id, ...meta };
    }),
    substituir: (id, { base, autor }) => executar(async ({ db, fs }) => {
      const conteudo = serializar(base);
      const refMeta = fs.doc(db, ...colecao, id);
      const atual = await fs.getDoc(refMeta);
      if (!atual.exists()) throw new Error('Versão não encontrada na nuvem.');
      const meta = { ...atual.data(), salvoEm: new Date().toISOString(), autor: autor || atual.data().autor || '', tamanho: conteudo.length };
      const lote = fs.writeBatch(db);
      lote.set(refMeta, meta);
      lote.set(fs.doc(db, ...colecaoConteudo, id), { conteudo });
      await lote.commit();
      return { id, ...meta };
    }),
    renomear: (id, nome) => executar(async ({ db, fs }) => {
      const refMeta = fs.doc(db, ...colecao, id);
      const atual = await fs.getDoc(refMeta);
      if (!atual.exists()) throw new Error('Versão não encontrada na nuvem.');
      const meta = { ...atual.data(), nome: String(nome).trim() };
      await fs.setDoc(refMeta, meta);
      return { id, ...meta };
    }),
    abrir: (id) => executar(async ({ db, fs }) => {
      const [meta, dados] = await Promise.all([fs.getDoc(fs.doc(db, ...colecao, id)), fs.getDoc(fs.doc(db, ...colecaoConteudo, id))]);
      if (!meta.exists() || !dados.exists()) throw new Error('Versão não encontrada na nuvem.');
      return { id, ...meta.data(), base: JSON.parse(dados.data().conteudo) };
    }),
    remover: (id) => executar(async ({ db, fs }) => {
      const lote = fs.writeBatch(db);
      lote.delete(fs.doc(db, ...colecao, id));
      lote.delete(fs.doc(db, ...colecaoConteudo, id));
      await lote.commit();
    }),
  };
}

/** Garante o cadastro de quem foi criado pelo console (sem passar por "Criar conta"). */
function garantirCadastro(usuario, nome) {
  return executar(async ({ db, fs }) => {
    const nomeLimpo = String(nome || usuario.displayName || usuario.email.split('@')[0]).trim();
    await fs.setDoc(fs.doc(db, 'usuarios', usuario.uid), { nome: nomeLimpo, email: usuario.email, criadoEm: new Date().toISOString() });
    const ref = fs.doc(db, 'usuarios_email', usuario.email);
    if (!(await fs.getDoc(ref)).exists()) await fs.setDoc(ref, { uid: usuario.uid, nome: nomeLimpo });
  });
}

/** Codigo da obra a partir da sigla: "WSF3" -> "wsf3", "Obra Nova 1" -> "obra-nova-1". */
function codigoObra(texto) {
  return String(texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

/** Cria uma obra (gestor geral). Falha se o codigo ja existir. */
function criarObra({ codigo, nome, sigla, controles, autor }) {
  return executar(async ({ db, fs }) => {
    const ref = fs.doc(db, 'obras', codigo);
    if ((await fs.getDoc(ref)).exists()) throw new Error(`Já existe uma obra com o código "${codigo}".`);
    const agora = new Date().toISOString();
    await fs.setDoc(ref, { nome, sigla, situacao: 'ativa', controles, criadoEm: agora, criadoPor: autor, atualizadoEm: agora, atualizadoPor: autor });
  });
}

/** Atualiza campos da obra (gestor geral: tudo; gestor da obra: so "controles"). */
const atualizarObra = (codigo, campos, autor) => executar(({ db, fs }) =>
  fs.updateDoc(fs.doc(db, 'obras', codigo), { ...campos, atualizadoEm: new Date().toISOString(), atualizadoPor: autor }));

const listarMembros = (obra) => executar(async ({ db, fs }) =>
  (await fs.getDocs(fs.collection(db, 'obras', obra, 'membros'))).docs.map((d) => d.data()));

const salvarMembro = (obra, membro, autor) => executar(({ db, fs }) =>
  fs.setDoc(fs.doc(db, 'obras', obra, 'membros', membro.uid), {
    uid: membro.uid, nome: membro.nome || '', email: membro.email || '',
    gestor: Boolean(membro.gestor), papeis: membro.papeis || {},
    atualizadoEm: new Date().toISOString(), atualizadoPor: autor,
  }));

const removerMembro = (obra, uid) => executar(({ db, fs }) =>
  fs.deleteDoc(fs.doc(db, 'obras', obra, 'membros', uid)));

/** Procura uma conta pelo e-mail exato. Retorna { uid, nome, email } ou null. */
const buscarUsuarioPorEmail = (email) => executar(async ({ db, fs }) => {
  const limpo = String(email || '').trim().toLowerCase();
  const d = await fs.getDoc(fs.doc(db, 'usuarios_email', limpo));
  return d.exists() ? { ...d.data(), email: limpo } : null;
});

/** Quantos documentos ha numa colecao (caminho em partes: ['obras', 'wsf3', 'efetivo']). */
const contarDocumentos = (partes) => executar(async ({ db, fs }) =>
  (await fs.getCountFromServer(fs.collection(db, ...partes))).data().count);

/**
 * Copia uma colecao antiga (formato de antes do Portal) para obras/{obra}/{controle}.
 * - A colecao antiga NAO e alterada (fica como backup).
 * - Documento que ja existe no destino e foi atualizado DEPOIS da origem nao e sobrescrito.
 * - comConteudo: versoes do padrao (lista em "origem" + conteudo em "origem_conteudo"):
 *   o conteudo de cada versao e copiado JUNTO com a lista, com a mesma decisao.
 * Retorna { total, copiados, ignorados }.
 */
function migrarColecao({ origem, obra, controle, comConteudo = false, onProgresso }) {
  return executar(async ({ db, fs }) => {
    const snap = await fs.getDocs(fs.collection(db, origem));
    const dataDe = (d) => String(d.updatedAt || d.atualizadoEm || d.salvoEmISO || d.salvoEm || d.createdAt || '');
    let copiados = 0;
    let ignorados = 0;
    for (const doc of snap.docs) {
      const destino = fs.doc(db, 'obras', obra, controle, doc.id);
      const dados = doc.data();
      const atual = await fs.getDoc(destino);
      if (atual.exists() && dataDe(atual.data()) > dataDe(dados)) {
        ignorados += 1;
      } else {
        const marca = { _migradoDe: origem, _migradoEm: new Date().toISOString() };
        if (comConteudo) {
          const conteudo = await fs.getDoc(fs.doc(db, `${origem}_conteudo`, doc.id));
          const lote = fs.writeBatch(db);
          lote.set(destino, { ...dados, ...marca });
          if (conteudo.exists()) lote.set(fs.doc(db, 'obras', obra, `${controle}_conteudo`, doc.id), conteudo.data());
          await lote.commit();
        } else {
          await fs.setDoc(destino, { ...dados, ...marca });
        }
        copiados += 1;
      }
      if (typeof onProgresso === 'function') onProgresso(copiados + ignorados, snap.size);
    }
    return { total: snap.size, copiados, ignorados };
  });
}

      { texto: 'Cancelar', variante: 'outline' },

/**
 * Painel da sessao (botao do canto superior direito):
 *   abrirPainelSessao({ perfil, descricao, abasExtras: [{ id, texto, conteudo }], onSair, onNomeAlterado })
 */
function abrirPainelSessao({ perfil, descricao = '', abasExtras = [], onSair, onNomeAlterado }) {
  let modal = null;
  async function alterarNome() {
    modal.fechar();
    const nome = await solicitarValor({
      titulo: 'Alterar meu nome', rotulo: 'Nome completo', valor: perfil.nome, obrigatorio: true,
      regras: { minCaracteres: 3, maxCaracteres: 80 }, textoConfirmar: 'Salvar',
    });
    if (!nome || nome.trim() === perfil.nome) return;
    try {
      await alterarMeuNome(nome);
      toast.sucesso('Nome alterado', nome.trim());
      if (typeof onNomeAlterado === 'function') onNomeAlterado(nome.trim());
    } catch (erro) {
      toast.erro('Nome não alterado', erro.message);
    }
  }
  const sessao = h('div', { class: 'ctc-stack' },
    h('p', { class: 'ctc-text-strong' }, perfil.nome),
    h('p', { class: 'ctc-text-muted ctc-text-sm' }, perfil.email),
    descricao ? h('p', { class: 'ctc-text-sm' }, descricao) : null,
    criarAlerta({ tipo: 'info', mensagem: 'Você continua conectado neste navegador até clicar em "Sair". Em computador compartilhado, sempre saia ao terminar.' }),
    h('div', { class: 'ctc-cluster' },
      criarBotao({ texto: 'Alterar meu nome', icone: 'editar', variante: 'outline', onClick: alterarNome }),
      criarBotao({ texto: 'Trocar senha', icone: 'configuracao', variante: 'outline', onClick: () => { modal.fechar(); abrirTrocarSenha(); } }),
      criarBotao({ texto: 'Sair', icone: 'sair', variante: 'danger-soft', onClick: () => { modal.fechar(); onSair(); } })));
  const abas = criarAbas({
    dentroDeModal: true,
    abas: [{ id: 'sessao', texto: 'Sessão', conteudo: sessao }, ...abasExtras],
  });
  modal = criarModal({
    titulo: 'Sessão',
    destruirAoFechar: true,
    conteudo: abas.elemento,
    acoes: [{ texto: 'Fechar', variante: 'primary' }],
  });
  modal.abrir();
}

/** Usuario logado (espera o Firebase recuperar a sessao salva no navegador). null = ninguem. */
async function usuarioAtual() {
  const { auth, fa } = await sdk();
  return new Promise((resolver) => {
    const parar = fa.onAuthStateChanged(auth, (u) => { parar(); resolver(u && !u.isAnonymous ? u : null); });
  });
}

return { iniciarFirebase, observarLogin, sair, entrar, usuarioAtual, carregarPerfil, abrirEsqueciSenha, criarTelaLogin, obraDaUrl, papelNaObra, criarArmazenamentoObra, abrirPainelSessao, PAPEIS };
})();

const DIAS_SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const temValor = (v) => v !== null && v !== undefined && v !== '';
const num = (v) => (typeof v === 'number' ? v : (paraNumero(v) ?? 0));

const diaSemana = (iso) => { const d = paraData(iso); return d ? DIAS_SEMANA[d.getDay()] : ''; };
const dataLonga = (iso) => `${formatarData(iso)} (${diaSemana(iso)})`;

function validarHora(v) {
  if (!v) return '';
  return /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(v).trim()) ? '' : 'Use HH:MM (ex.: 07:30).';
}
function minutosDaHora(v) {
  const m = String(v || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

/** Dias corridos entre duas datas ISO (b - a). */
function diasEntre(a, b) {
  const da = paraData(a); const db = paraData(b);
  if (!da || !db) return null;
  const ua = Date.UTC(da.getFullYear(), da.getMonth(), da.getDate());
  const ub = Date.UTC(db.getFullYear(), db.getMonth(), db.getDate());
  return Math.round((ub - ua) / 86400000);
}
function somarDias(iso, dias) {
  const d = paraData(iso);
  if (!d) return null;
  return formatarData(new Date(d.getFullYear(), d.getMonth(), d.getDate() + dias), 'iso');
}

/** Situacao do prazo contratual em uma data: { dia, prazo, restantes, termino } ou null. */
function prazoNaData(iso) {
  const c = estado.config || {};
  if (!c.inicio) return null;
  const dia = diasEntre(c.inicio, iso) + 1;
  const prazo = num(c.prazoDias) || null;
  return { dia, prazo, restantes: prazo ? prazo - dia : null, termino: prazo ? somarDias(c.inicio, prazo - 1) : null };
}
function textoPrazo(iso) {
  const p = prazoNaData(iso);
  if (!p) return 'Prazo não configurado';
  if (!p.prazo) return `Dia ${p.dia} da obra`;
  if (p.restantes < 0) return `Dia ${p.dia} de ${p.prazo} · ${-p.restantes} dia(s) além do prazo`;
  return `Dia ${p.dia} de ${p.prazo} · restam ${p.restantes} dia(s)`;
}

/** Jornada do dia em horas (horario de trabalho menos intervalo). */
function jornadaHoras(rdo) {
  const hr = rdo.horario || {};
  const ini = minutosDaHora(hr.inicio); const fim = minutosDaHora(hr.fim);
  if (ini == null || fim == null || fim <= ini) return 0;
  return Math.max(0, (fim - ini - num(hr.intervaloMin)) / 60);
}
function homemHoraLinha(l, rdo) {
  if (l.presenca !== 'Presente') return 0;
  const horas = temValor(l.horas) ? num(l.horas) : jornadaHoras(rdo) * (Number(l.fracao) || 1);
  return num(l.quantidade) * horas;
}
const efetivoPresente = (rdo) => (rdo.efetivo || []).filter((l) => l.presenca === 'Presente').reduce((s, l) => s + num(l.quantidade) * (Number(l.fracao) || 1), 0);
const homemHora = (rdo) => (rdo.efetivo || []).reduce((s, l) => s + homemHoraLinha(l, rdo), 0);
const efetivoPorTipo = (rdo) => {
  const propria = String((estado.config || {}).contratada || '').trim().toLowerCase();
  let proprio = 0; let terceiros = 0;
  (rdo.efetivo || []).filter((l) => l.presenca === 'Presente').forEach((l) => {
    const q = num(l.quantidade) * (Number(l.fracao) || 1);
    if (propria && String(l.empresa || '').trim().toLowerCase() === propria) proprio += q; else terceiros += q;
  });
  return { proprio, terceiros };
};

/** Condicao do dia pelos turnos trabalhados: Praticavel | Parcial | Impraticavel | Sem registro. */
function condicaoDoDia(rdo) {
  const turnos = TURNOS.map((t) => (rdo.clima || {})[t.chave] || {}).filter((t) => t.tempo && t.tempo !== 'Não trabalhado');
  if (!turnos.length) return 'Sem registro';
  const imp = turnos.filter((t) => t.condicao === 'Impraticável').length;
  if (!imp) return 'Praticável';
  return imp === turnos.length ? 'Impraticável' : 'Parcial';
}
const VARIANTE_CONDICAO = { 'Praticável': 'success', Parcial: 'warning', 'Impraticável': 'danger', 'Sem registro': 'neutral' };
const resumoClima = (rdo) => TURNOS.map((t) => ((rdo.clima || {})[t.chave] || {}).tempo).filter(Boolean).map((x) => (x === 'Não trabalhado' ? '—' : x)).join(' / ') || '—';

const listaRdos = () => [...estado.rdos.values()].sort((a, b) => a.data.localeCompare(b.data));
const rdoAnterior = (iso) => listaRdos().filter((r) => r.data < iso).pop() || null;
const travado = (r) => STATUS_TRAVADOS.includes(r.status);
const podeEditarRdo = (r) => podeEditarPerfil() && ['rascunho', 'recusado'].includes(r.status);


/* =============================================================================
   03. ARMAZENAMENTO NESTE APARELHO (IndexedDB) E NUVEM
   Cada item local: { chave, valor, pendente, em }. Chaves:
     {obra}|config   {obra}|rdo|{id}   {obra}|foto|{rdoId}|{fotoId}
   ========================================================================== */

const memoriaLocal = new Map();   // usado na demonstracao e se o navegador nao tiver IndexedDB
let bancoLocal = null;
function abrirBancoLocal() {
  if (!bancoLocal) {
    bancoLocal = new Promise((resolver, rejeitar) => {
      if (!window.indexedDB) { rejeitar(new Error('sem IndexedDB')); return; }
      const pedido = indexedDB.open('rdo-kz', 1);
      pedido.onupgradeneeded = () => { pedido.result.createObjectStore('itens', { keyPath: 'chave' }); };
      pedido.onsuccess = () => resolver(pedido.result);
      pedido.onerror = () => rejeitar(pedido.error);
    }).catch((erro) => { bancoLocal = null; throw erro; });
  }
  return bancoLocal;
}
async function operacaoLocal(modo, acao) {
  const db = await abrirBancoLocal();
  return new Promise((resolver, rejeitar) => {
    const tx = db.transaction('itens', modo);
    const pedido = acao(tx.objectStore('itens'));
    let resultado;
    if (pedido) pedido.onsuccess = () => { resultado = pedido.result; };
    tx.oncomplete = () => resolver(resultado);
    tx.onerror = () => rejeitar(tx.error);
    tx.onabort = () => rejeitar(tx.error || new Error('Gravação neste aparelho cancelada (espaço cheio?).'));
  });
}
const usarMemoria = () => ehDemo();
const chaveLocal = (...partes) => [estado.obra.id, ...partes].join('|');

async function localLer(chave) {
  if (usarMemoria()) return memoriaLocal.get(chave) || null;
  try { return (await operacaoLocal('readonly', (st) => st.get(chave))) || null; } catch (erro) { return memoriaLocal.get(chave) || null; }
}
async function localGravar(chave, valor, pendente) {
  const item = { chave, valor: copiaProfunda(valor), pendente: Boolean(pendente), em: agoraIso() };
  memoriaLocal.set(chave, item);
  if (usarMemoria()) return;
  try { await operacaoLocal('readwrite', (st) => st.put(item)); } catch (erro) { estado.sync.erro = `Não foi possível gravar neste aparelho: ${erro.message}`; }
}
async function localApagar(chave) {
  memoriaLocal.delete(chave);
  if (usarMemoria()) return;
  try { await operacaoLocal('readwrite', (st) => st.delete(chave)); } catch (erro) { /* sem banco */ }
}
async function localListar(prefixo) {
  if (usarMemoria()) return [...memoriaLocal.values()].filter((i) => i.chave.startsWith(prefixo));
  try { return (await operacaoLocal('readonly', (st) => st.getAll(IDBKeyRange.bound(prefixo, `${prefixo}￿`)))) || []; } catch (erro) { return [...memoriaLocal.values()].filter((i) => i.chave.startsWith(prefixo)); }
}

const nuvemDemo = new Map();      // demonstracao: "nuvem" em memoria
const caminhoControle = () => ['obras', estado.obra.id, estado.controle];
const limparParaNuvem = (o) => JSON.parse(JSON.stringify(o, (k, v) => (v === undefined ? null : v)));

async function firestore() { return KZ.iniciarFirebase(FIREBASE_KZ); }
function erroNuvem(erro) {
  const t = String((erro && (erro.code || erro.message)) || erro);
  if (/permission/i.test(t)) return new Error('Sem permissão na nuvem para esta ação. O gestor da obra precisa liberar o papel Editor (ou Admin) no RDO, no Portal KZ.');
  if (/unavailable|network|offline/i.test(t)) return new Error('Sem conexão com a nuvem.');
  return erro instanceof Error ? erro : new Error(t);
}
async function nuvem(acao) {
  try { return await acao(); } catch (erro) { throw erroNuvem(erro); }
}

const nuvemListar = () => nuvem(async () => {
  if (ehDemo()) return [...nuvemDemo.entries()].filter(([k]) => !k.includes('/')).map(([id, d]) => ({ id, ...copiaProfunda(d) }));
  const { db, fs } = await firestore();
  const snap = await fs.getDocs(fs.collection(db, ...caminhoControle()));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
});
const nuvemLer = (id) => nuvem(async () => {
  if (ehDemo()) return nuvemDemo.has(id) ? copiaProfunda(nuvemDemo.get(id)) : null;
  const { db, fs } = await firestore();
  const d = await fs.getDoc(fs.doc(db, ...caminhoControle(), id));
  return d.exists() ? d.data() : null;
});
const nuvemGravar = (id, dados) => nuvem(async () => {

});
/** Acrescenta itens a listas (adendos, historico) sem tocar no resto do documento. */

  const { db, fs } = await firestore();
  const extra = {};
  Object.entries(listas).forEach(([k, itens]) => { extra[k] = fs.arrayUnion(...limparParaNuvem(itens)); });
  await fs.updateDoc(fs.doc(db, ...caminhoControle(), id), { ...limparParaNuvem(campos), ...extra });
});
const nuvemApagar = (id) => nuvem(async () => {

});

/** Carrega o que esta neste aparelho e, com sinal, atualiza pela nuvem. */
async function carregarObra() {
  estado.rdos = new Map();
  estado.pendentes = new Set();
  estado.fotosPendentes = new Set();
  estado.configPendente = false;
  const prefixo = `${estado.obra.id}|`;
  const locais = await localListar(prefixo);
  locais.forEach((item) => {
    const partes = item.chave.split('|');
    if (partes[1] === 'config') { estado.config = normalizarConfig(item.valor); estado.configPendente = item.pendente; }
    if (partes[1] === 'rdo') { estado.rdos.set(partes[2], item.valor); if (item.pendente) estado.pendentes.add(partes[2]); }
    if (partes[1] === 'foto' && item.pendente) estado.fotosPendentes.add(`${partes[2]}|${partes[3]}`);
  });
  if (!estado.config) estado.config = configVazia();
  if (navigator.onLine || ehDemo()) {
    try { await baixarDaNuvem(); } catch (erro) { estado.sync.erro = erro.message; }
  }
  aplicarAprovadores();
}

/** Baixa config e RDOs da nuvem; o que esta pendente neste aparelho prevalece (exceto RDO ja travado na nuvem). */
async function baixarDaNuvem() {
  const docs = await nuvemListar();
  const avisos = [];
  for (const d of docs) {
    const { id, ...dados } = d;
    if (id === 'config') {
      if (!estado.configPendente) { estado.config = normalizarConfig(dados); await localGravar(chaveLocal('config'), estado.config, false); }
    } else if (id.startsWith('rdo-')) {
      const local = estado.rdos.get(id);
      if (estado.pendentes.has(id) && local) {
        if (travado(dados) && (dados.atualizadoEm || '') > (local._baseNuvem || '')) {
          avisos.push(formatarData(dados.data));
          estado.pendentes.delete(id);
          estado.rdos.set(id, { ...dados, id, _baseNuvem: dados.atualizadoEm || '' });
          await localGravar(chaveLocal('rdo', id), estado.rdos.get(id), false);
        }
      } else {
        estado.rdos.set(id, { ...dados, id, _baseNuvem: dados.atualizadoEm || '' });
        await localGravar(chaveLocal('rdo', id), estado.rdos.get(id), false);
      }
    }
  }
  // RDO apagado na nuvem (e sem alteracao pendente aqui) sai deste aparelho
  const idsNuvem = new Set(docs.map((d) => d.id));
  for (const id of [...estado.rdos.keys()]) {
    if (!idsNuvem.has(id) && !estado.pendentes.has(id)) { estado.rdos.delete(id); await localApagar(chaveLocal('rdo', id)); }
  }
  estado.sync.ultimo = agoraIso();
  if (avisos.length) toast.aviso('Alterações descartadas', `O(s) RDO(s) de ${avisos.join(', ')} já foram aprovados na nuvem; as alterações feitas neste aparelho foram descartadas.`);
}

/** Aprovadores: do Portal KZ (controle RDO da obra); sem eles, os provisorios da configuracao. */
function aplicarAprovadores() {
  const portal = estado.aprovadoresPortal || {};
  const prov = (estado.config || {}).aprovadoresProvisorios || {};
  estado.aprovadoresDoPortal = Boolean(portal.contratada || portal.contratante);
  estado.aprovadores = estado.aprovadoresDoPortal
    ? { contratada: portal.contratada || '', contratante: portal.contratante || '' }
    : { contratada: prov.contratada || '', contratante: prov.contratante || '' };
}

let temporizadorSync = null;
function agendarSincronizacao() {
  clearTimeout(temporizadorSync);
  temporizadorSync = setTimeout(() => sincronizar({ silencioso: true }), 1500);
}
const totalPendente = () => estado.pendentes.size + estado.fotosPendentes.size + (estado.configPendente ? 1 : 0);

/** Envia para a nuvem tudo o que esta pendente neste aparelho. */
async function sincronizar({ silencioso = false } = {}) {
  if (estado.sync.rodando) return false;
  if (!navigator.onLine && !ehDemo()) {
    if (!silencioso) toast.aviso('Sem sinal', 'Tudo continua guardado neste aparelho e vai para a nuvem quando a conexão voltar.');
    return false;
  }
  estado.sync.rodando = true;
  try {
    // 1) fotos primeiro (o RDO so aponta para fotos que ja estao na nuvem)
    for (const chave of [...estado.fotosPendentes]) {
      const [rdoId, fotoId] = chave.split('|');
      const item = await localLer(chaveLocal('foto', rdoId, fotoId));
      if (item && item.valor) await nuvemFotoGravar(rdoId, fotoId, item.valor);
      if (item) await localGravar(item.chave, item.valor, false);
      estado.fotosPendentes.delete(chave);
    }
    // 2) configuracao
    if (estado.configPendente) {
      await nuvemGravar('config', { ...estado.config, atualizadoEm: agoraIso(), atualizadoPor: meuNome() });
      estado.configPendente = false;
      await localGravar(chaveLocal('config'), estado.config, false);
    }
    // 3) RDOs
    const descartados = [];
    for (const id of [...estado.pendentes]) {
      const local = estado.rdos.get(id);
      if (!local) { estado.pendentes.delete(id); continue; }
      const naNuvem = await nuvemLer(id);
      if (naNuvem && travado(naNuvem)) {
        // aprovado na nuvem enquanto este aparelho estava sem sinal: vale a nuvem
        descartados.push(formatarData(local.data));
        estado.rdos.set(id, { ...naNuvem, id, _baseNuvem: naNuvem.atualizadoEm || '' });
      } else {
        const { _baseNuvem, ...enviar } = local;
        await nuvemGravar(id, enviar);
        estado.rdos.set(id, { ...enviar, _baseNuvem: enviar.atualizadoEm || '' });
      }
      await localGravar(chaveLocal('rdo', id), estado.rdos.get(id), false);
      estado.pendentes.delete(id);
    }
    estado.sync.ultimo = agoraIso();
    estado.sync.erro = null;
    if (descartados.length) toast.aviso('Alterações descartadas', `O(s) RDO(s) de ${descartados.join(', ')} já tinham sido aprovados na nuvem.`);
    if (!silencioso) toast.sucesso('Sincronizado', 'Tudo foi enviado para a nuvem da obra.');
    return true;
  } catch (erro) {
    estado.sync.erro = erro.message;
    if (!silencioso) toast.erro('Falha na sincronização', `${erro.message} Nada foi perdido: continua guardado neste aparelho.`);
    return false;
  } finally {
    estado.sync.rodando = false;
    atualizarPilulaSinc();
  }
}
window.addEventListener('online', () => { if (aplicativo && totalPendente()) sincronizar({ silencioso: true }); });

/** Exige internet para acoes que nao podem ser feitas offline (aprovar, recusar, adendo, configuracao). */

function rdoVazio(dataIso) {
  const c = estado.config;
  const numero = Math.max(0, ...listaRdos().map((r) => num(r.numero))) + 1;
  return {
    id: idRdo(dataIso), data: dataIso, numero, status: 'rascunho',
    criadoEm: agoraIso(), criadoPor: meuNome(), criadoPorEmail: meuEmail(),
    atualizadoEm: agoraIso(), atualizadoPor: meuNome(),
    responsavel: meuNome(),
    clima: Object.fromEntries(TURNOS.map((t) => [t.chave, { tempo: t.chave === 'noite' ? 'Não trabalhado' : 'Bom', condicao: 'Praticável' }])),
    chuvaMm: null,
    horario: { inicio: c.horaInicio || '07:00', fim: c.horaFim || '17:00', intervaloMin: num(c.intervaloMin), paralisacaoHoras: null, paralisacaoMotivo: '' },
    efetivo: [], equipamentos: [], atividades: [], ocorrencias: [], materiais: [], visitas: [],
    fotos: [], comentarios: '',
    aprovacoes: { contratada: null, contratante: null },
    adendos: [],
    historico: [{ acao: 'Criado', autor: meuNome(), em: agoraIso() }],
  };
}

/** Cria o RDO do dia (opcionalmente copiando efetivo, equipamentos e atividades nao concluidas do anterior). */
async function criarRdo(dataIso, { copiar }) {
  const id = idRdo(dataIso);
  if (estado.rdos.has(id)) throw new Error(`Já existe o RDO de ${formatarData(dataIso)}.`);
  const rdo = rdoVazio(dataIso);
  if (copiar) {
    const ant = rdoAnterior(dataIso);
    if (ant) {
      const novoId = (l) => ({ ...copiaProfunda(l), _id: gerarId('l') });
      rdo.efetivo = (ant.efetivo || []).map((l) => ({ ...novoId(l), presenca: 'Presente', horas: null }));
      rdo.equipamentos = (ant.equipamentos || []).map((l) => ({ ...novoId(l), horas: null }));
      rdo.atividades = (ant.atividades || []).filter((l) => !['Concluída'].includes(l.situacao)).map((l) => ({ ...novoId(l), situacao: 'Em andamento', quantidade: null }));
      rdo.horario = { ...copiaProfunda(ant.horario || rdo.horario), paralisacaoHoras: null, paralisacaoMotivo: '' };
      rdo.historico[0].obs = `Copiado do RDO de ${formatarData(ant.data)}`;
    }
  }
  await gravarRdo(rdo, { semHistorico: true });
  return rdo;
}

/** Grava o RDO neste aparelho (pendente) e agenda o envio para a nuvem. */
async function gravarRdo(rdo, { semHistorico = false, acao } = {}) {
  rdo.atualizadoEm = agoraIso();
  rdo.atualizadoPor = meuNome();
  if (!semHistorico && acao) rdo.historico = [...(rdo.historico || []), { acao, autor: meuNome(), em: agoraIso() }];
  estado.rdos.set(rdo.id, rdo);
  estado.pendentes.add(rdo.id);
  await localGravar(chaveLocal('rdo', rdo.id), rdo, true);
  atualizarPilulaSinc();
  agendarSincronizacao();
}

/** Altera um RDO editavel, conferindo antes se ele nao foi travado. */
async function editarRdo(id, alterar, acao) {
  const rdo = estado.rdos.get(id);
  if (!rdo) return false;
  if (!podeEditarRdo(rdo)) {
    toast.aviso('RDO não editável', travado(rdo) ? 'O RDO já foi aprovado: use "Adicionar adendo".' : 'Este RDO não pode ser editado pelo seu perfil ou situação.');
    return false;
  }
  const copia = copiaProfunda(rdo);
  alterar(copia);
  await gravarRdo(copia, { acao });
  return true;
}

/** Verifica se o RDO esta completo o bastante para enviar. */
function pendenciasParaEnviar(rdo) {
  const faltas = [];
  if (!TURNOS.some((t) => ((rdo.clima || {})[t.chave] || {}).tempo)) faltas.push('clima do dia');
  if (blocoVisivel('efetivo') && !(rdo.efetivo || []).length) faltas.push('efetivo');
  if (!(rdo.atividades || []).length && !(rdo.ocorrencias || []).length) faltas.push('pelo menos uma atividade ou ocorrência');
  return faltas;
}

async function enviarRdo(id) {
  const rdo = estado.rdos.get(id);
  const faltas = pendenciasParaEnviar(rdo);
  if (faltas.length) { toast.aviso('Falta preencher', `Antes de enviar, informe: ${faltas.join(', ')}.`); return; }
  if (!(await confirmar({ titulo: `Enviar o RDO de ${formatarData(rdo.data)}?`, mensagem: 'Depois de enviado, o RDO segue para a aprovação da contratada e só volta a ser editado se for retirado do envio ou recusado.', textoConfirmar: 'Enviar para aprovação' }))) return;
  const copia = copiaProfunda(rdo);
  copia.status = 'enviado';
  copia.enviadoEm = agoraIso();
  copia.enviadoPor = meuNome();
  copia.aprovacoes = { contratada: null, contratante: null };
  await gravarRdo(copia, { acao: 'Enviado para aprovação' });
  toast.sucesso('Relatório enviado', estado.aprovadores.contratada ? `Aguardando a 1ª aprovação: ${estado.aprovadores.contratada}.` : 'Atenção: a obra ainda não tem aprovador da contratada cadastrado.');

}

async function retirarEnvio(id) {
  const rdo = estado.rdos.get(id);
  if (rdo.status !== 'enviado' || !podeEditarPerfil()) return;
  if (!exigirSinal('Retirar do envio')) return;
  const naNuvem = await lerSituacaoAtual(id);
  if (naNuvem && naNuvem.status !== 'enviado') { toast.aviso('Não foi possível', 'A situação do RDO mudou na nuvem. A tela foi atualizada.'); aplicativo.navegar(paginaRdoAtual()); return; }
  const copia = copiaProfunda(rdo);
  copia.status = 'rascunho';
  await gravarRdo(copia, { acao: 'Retirado do envio para correção' });
  await sincronizar({ silencioso: true });
  aplicativo.navegar(paginaRdoAtual());
}

/** Le a situacao atual do RDO na nuvem (e atualiza a copia local). */
async function lerSituacaoAtual(id) {
  const naNuvem = await nuvemLer(id);
  if (naNuvem && !estado.pendentes.has(id)) {
    estado.rdos.set(id, { ...naNuvem, id, _baseNuvem: naNuvem.atualizadoEm || '' });
    await localGravar(chaveLocal('rdo', id), estado.rdos.get(id), false);
  }
  return naNuvem;
}

/** Aprovacao de um dos lados (contratada / contratante). Feita direto na nuvem. */
async function aprovarRdo(id, lado) {
  if (!exigirSinal('Aprovar')) return;
  if (estado.pendentes.has(id)) await sincronizar({ silencioso: true });
  const atual = await lerSituacaoAtual(id);
  if (!atual) { toast.aviso('RDO ainda não está na nuvem', 'Sincronize o aparelho de quem preencheu antes de aprovar.'); return; }
  const esperado = lado === 'contratada' ? 'enviado' : 'em-aprovacao';
  if (atual.status !== esperado) { toast.aviso('Situação mudou', `Este RDO está "${STATUS_RDO[atual.status].curto}" e não aguarda a sua aprovação.`); aplicativo.navegar(paginaRdoAtual()); return; }
  const obs = await solicitarValor({ titulo: `Aprovar o RDO de ${formatarData(atual.data)} (${lado})`, rotulo: 'Comentário da aprovação (opcional)', tipo: 'textarea', textoConfirmar: 'Aprovar' });
  if (obs === null) return;
  const aprov = { email: meuEmail(), nome: meuNome(), em: agoraIso(), obs: obs || '' };
  const novoStatus = lado === 'contratada' ? 'em-aprovacao' : 'aprovado';
  try {
    await nuvemAcrescentar(id, { status: novoStatus, [`aprovacoes.${lado}`]: aprov, atualizadoEm: agoraIso(), atualizadoPor: meuNome() },
      { historico: [{ acao: `Aprovado pela ${lado}`, autor: meuNome(), em: agoraIso(), obs: obs || '' }] });
    if (ehDemo()) { const d = nuvemDemo.get(id); d.aprovacoes = { ...(d.aprovacoes || {}), [lado]: aprov }; delete d[`aprovacoes.${lado}`]; }
    await lerSituacaoAtual(id);
    toast.sucesso('RDO aprovado', novoStatus === 'aprovado' ? 'Aprovação concluída pelos dois lados.' : 'Agora segue para a aprovação do contratante.');
  } catch (erro) { toast.erro('Não foi possível aprovar', erro.message); }
  aplicativo.navegar(paginaRdoAtual());
}

async function recusarRdo(id, lado) {
  if (!exigirSinal('Recusar')) return;
  const atual = await lerSituacaoAtual(id);
  const esperado = lado === 'contratada' ? 'enviado' : 'em-aprovacao';
  if (!atual || atual.status !== esperado) { toast.aviso('Situação mudou', 'Este RDO não aguarda a sua aprovação.'); aplicativo.navegar(paginaRdoAtual()); return; }
  const motivo = await solicitarValor({ titulo: `Recusar o RDO de ${formatarData(atual.data)}`, rotulo: 'Motivo da recusa (o preenchedor vai ver)', tipo: 'textarea', obrigatorio: true, textoConfirmar: 'Recusar' });
  if (!motivo) return;
  try {
    await nuvemAcrescentar(id, { status: 'recusado', 'aprovacoes.contratada': null, 'aprovacoes.contratante': null, recusa: { lado, nome: meuNome(), email: meuEmail(), em: agoraIso(), motivo }, atualizadoEm: agoraIso(), atualizadoPor: meuNome() },
      { historico: [{ acao: `Recusado pela ${lado}`, autor: meuNome(), em: agoraIso(), obs: motivo }] });
    if (ehDemo()) { const d = nuvemDemo.get(id); d.aprovacoes = { contratada: null, contratante: null }; delete d['aprovacoes.contratada']; delete d['aprovacoes.contratante']; }
    await lerSituacaoAtual(id);
    toast.aviso('RDO recusado', 'Voltou para o preenchedor corrigir.');
  } catch (erro) { toast.erro('Não foi possível recusar', erro.message); }

}

async function adicionarAdendo(id) {
